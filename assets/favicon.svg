<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 64 64" role="img" aria-labelledby="title">
  <title id="title">Halloween Monster Hunt</title>
  <defs>
    <radialGradient id="moon" cx="38%" cy="32%" r="72%">
      <stop offset="0" stop-color="#ffb13b"/>
      <stop offset=".46" stop-color="#e94c1b"/>
      <stop offset="1" stop-color="#521323"/>
    </radialGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2.1" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="64" height="64" rx="14" fill="#0c0812"/>
  <circle cx="32" cy="32" r="24" fill="#ff7a1a" opacity=".22" filter="url(#glow)"/>
  <circle cx="32" cy="32" r="22" fill="url(#moon)" stroke="#ff7a1a" stroke-width="1.5"/>
  <circle cx="23" cy="23" r="4.2" fill="#7c1c28" opacity=".48"/>
  <circle cx="42" cy="19" r="2.7" fill="#6c1425" opacity=".42"/>
  <circle cx="44" cy="39" r="5.3" fill="#73192a" opacity=".42"/>
  <circle cx="20" cy="43" r="2.5" fill="#ff9145" opacity=".28"/>
  <text x="32" y="43" text-anchor="middle" fill="#fff8e8" stroke="#0c0812" stroke-width=".8" paint-order="stroke" font-family="Georgia, 'Times New Roman', serif" font-size="33" font-weight="900">M</text>
</svg>
