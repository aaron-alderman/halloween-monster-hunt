name: Publish Halloween Monster Hunt

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Validate the expedition packet
        run: node scripts/validate.mjs
      - name: Assemble the static site
        run: |
          mkdir _site
          cp index.html styles.css app.js FOR_AGENTS.md CONTRIBUTING.md _site/
          cp -R assets _site/assets
          cp -R data _site/data
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
